name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint calculator and tests
        run: >-
          python -m ruff check calci_python tests
          showcase-projects/python-api-automation-framework/src
          showcase-projects/python-api-automation-framework/tests
      - name: Run tests
        run: python -m pytest
